spring.application.name=gestion-alumni-uasz-backend
server.port=8080

# Base de donnees H2 en memoire : aucune installation requise
spring.datasource.url=jdbc:h2:mem:alumnidb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console H2 accessible sur http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
